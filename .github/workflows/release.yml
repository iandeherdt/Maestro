name: Release

# Builds the binaries for a version and attaches them to a GitHub release,
# with a checksum file the install script verifies. It runs for a pushed
# version tag, or from the Actions page with a version typed in, in which
# case the release creates the tag on the commit that was built.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # The newest stable Go, so that a binary never ships with a
          # standard library that has known holes. go.mod names the oldest
          # version the code builds with.
          go-version: stable
          check-latest: true
      - name: Version
        id: version
        env:
          TYPED: ${{ inputs.version }}
        run: |
          tag="${TYPED:-$GITHUB_REF_NAME}"
          # A version typed without the leading v gets one.
          case "$tag" in [0-9]*) tag="v$tag" ;; esac
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must look like v1.2.3" >&2
            exit 1
          fi
          if [ -n "$TYPED" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "a typed version is released from main only" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./...
      - name: Build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: scripts/build-release.sh "$TAG" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
