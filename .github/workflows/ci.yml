name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        # The container tests need Docker, which the runner has. With the
        # internet they also build the real sandbox image.
        env:
          SYMPHONY_TEST_INTERNET: "1"
        run: go test -race -timeout 20m ./...
      - name: Test with rootless Podman
        # The same container tests against Podman as an ordinary user,
        # which is how the service runs on RHEL.
        env:
          SYMPHONY_TEST_ENGINE: podman
        run: go test -count=1 -timeout 20m ./internal/dockerbox ./cmd/symphony
      - name: Install script
        run: scripts/test-install.sh
