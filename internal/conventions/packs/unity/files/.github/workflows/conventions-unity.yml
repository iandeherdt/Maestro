# The same checks the Maestro service runs before it pushes. Make this check
# required in the branch protection of the main branch.
#
# Unity needs a licence to open the project and run its tests. With the
# repository secret UNITY_LICENSE (the contents of an activated licence file,
# Unity_lic.ulf, for this runner; see the GameCI documentation on activation)
# this runs every check. Without it, it runs the checks that need no licence
# and says so: Maestro has already run Unity's tests on its own machine
# before it pushed, but a change that did not come from Maestro is not
# tested by Unity here.
name: conventions-unity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  conventions-unity:
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.5.8f1-base-4.0.0@sha256:b34dac1ef79a927bc078d95e8c0993c94f47ac7b0b66e354a29b7ead878b90a8
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Without a licence, the meta files only
        if: env.UNITY_LICENSE == ''
        run: |
          echo "::warning title=No Unity licence in CI::Only the meta files were checked here. Unity's compile and tests ran on the Maestro machine before the push; for changes from elsewhere, add the repository secret UNITY_LICENSE."
          sh conventions/unity/meta.sh
      - name: Packages
        if: env.UNITY_LICENSE != ''
        run: sh conventions/unity/prepare.sh
      - name: Meta files, compile, EditMode and PlayMode tests
        if: env.UNITY_LICENSE != ''
        run: sh conventions/unity/verify.sh
