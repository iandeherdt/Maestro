# The same checks the Maestro service runs before it pushes. Make this check
# required in the branch protection of the main branch.
name: conventions-godot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  conventions-godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Godot and gdtoolkit
        run: |
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          file="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o "$file" "$base/$file"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep "  $file\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$file" -d "$RUNNER_TEMP/godot"
          rm -f "$file" SHA512-SUMS.txt
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          pip install gdtoolkit==4.5.0
      - name: Version, scripts, format, lint, import, tests
        run: sh conventions/godot/verify.sh
